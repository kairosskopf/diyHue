name: Publish diyHue to GHCR

on:
  push:
    branches: [hue-state-fixes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-state-fixes
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.fork && github.ref == 'refs/heads/hue-state-fixes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the AMD64 image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -f .build/Dockerfile -t "$image:state-fixes-$GITHUB_SHA" .
      - name: Test the built image
        run: |
          docker run --rm -v "$PWD/tests:/opt/hue-emulator/tests:ro" \
            -v "$PWD/examples:/opt/hue-emulator/examples:ro" \
            -e PYTHONPATH=/opt/hue-emulator "$IMAGE:state-fixes-$GITHUB_SHA" \
            python3 -m unittest discover -s tests
      - name: Publish tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:state-fixes-$GITHUB_SHA"
          docker tag "$IMAGE:state-fixes-$GITHUB_SHA" "$IMAGE:state-fixes"
          docker push "$IMAGE:state-fixes"
